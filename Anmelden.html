<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Anmelden</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <h2>Anmelden</h2>

  <label for="loginUser">Benutzername:</label><br>
  <input type="text" id="loginUser"><br><br>

  <label for="loginPass">Passwort:</label><br>
  <input type="password" id="loginPass"><br><br>

  <button onclick="anmelden()">Login</button>
  <p id="loginInfo"></p>

  <hr>

  <p>Noch kein Konto?</p>
  <button onclick="window.location.href='Registrieren.html'">Registrieren</button>

  <hr>

  <button onclick="window.location.href='Index.html'" style="margin-top:20px;">Zurück zur Startseite</button>

  <script>
    function anmelden() {
      const user = document.getElementById("loginUser").value;
      const pw = document.getElementById("loginPass").value;
      const savedUser = localStorage.getItem("user");
      const savedPw = localStorage.getItem("pw");

      if (user === savedUser && pw === savedPw) {
        document.getElementById("loginInfo").textContent = "Login erfolgreich!";
        window.location.href = "Index.html";
      } else {
        document.getElementById("loginInfo").textContent = "Benutzername oder Passwort falsch.";
      }
    }
  </script>
</body>
</html>
