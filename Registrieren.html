<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Registrieren</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <h2>Registrieren</h2>

  <label for="regUsername">Benutzername:</label><br>
  <input type="text" id="regUsername"><br><br>

  <label for="regPassword">Passwort:</label><br>
  <input type="password" id="regPassword"><br><br>

  <label for="alter">Alter:</label><br>
  <input type="number" id="alter"><br><br>

  <label for="groesse">Größe (in cm):</label><br>
  <input type="number" id="groesse"><br><br>

  <label for="gewicht">Gewicht (in kg):</label><br>
  <input type="number" id="gewicht"><br><br>

  <label for="sport">Sport (in Stunden/Woche):</label><br>
  <input type="number" id="sport"><br><br>

  <button id="registerBtn">Registrieren</button>
  <p id="regInfo"></p>

  <hr>
  <p>Bereits ein Konto?</p>
  <button onclick="window.location.href='Anmelden.html'">Zur Anmeldung</button>

  <script src="Registrieren.js"></script>
</body>
</html>
