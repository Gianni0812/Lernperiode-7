<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Angaben</title>

</head>
<body>

  <nav>
    <a href="Index.html">Start</a> |
    <a href="Kalorienrechner.html">Kalorienrechner</a> |
    <a href="Lebensmittel.html">Lebensmittel</a> |

  </nav>
  <hr>

  <h2>Deine Angaben</h2>

  <label>Alter: <input type="number" id="alter"></label><br>
  <label>Gewicht (kg): <input type="number" id="gewicht"></label><br>
  <label>Größe (cm): <input type="number" id="groesse"></label><br>
  <label>Sport (h/Woche): <input type="number" id="sport"></label><br><br>

  <button onclick="speichern()">Speichern</button>

  <p id="bestaetigung"></p>

  <script>
    function speichern() {
      const alter = document.getElementById('alter').value;
      const gewicht = document.getElementById('gewicht').value;
      const groesse = document.getElementById('groesse').value;
      const sport = document.getElementById('sport').value;

      localStorage.setItem("alter", alter);
      localStorage.setItem("gewicht", gewicht);
      localStorage.setItem("groesse", groesse);
      localStorage.setItem("sport", sport);

      document.getElementById("bestaetigung").innerText = "Angaben wurden gespeichert ";
    }
  </script>

</body>
</html>
